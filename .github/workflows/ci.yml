name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 0 * * *'  # nightly UTC 00:00

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify docs
        run: npm run verify-docs

      - name: Dead code (Knip)
        run: npm run dead-code

      - name: Harness meta (L5)
        run: npm run verify-harness-meta

      - name: Test + Coverage
        run: npm run test:coverage
        env:
          LAW_API_OC: test-oc

      - name: Build
        run: npm run build

  nightly-canary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run canary:ytdlp
        continue-on-error: true
