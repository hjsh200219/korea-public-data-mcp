# Smithery configuration — https://smithery.ai/docs/build/project-config/smithery.yaml

name: K Public Data MCP
description: >
  Korean public data unified MCP server — law (MOJ), DART corporate disclosures, customs (UNI-PASS), FSS financial products, FSC insurance, KONEPS procurement, KEXIM exchange rates, MAFRA, Korea Tourism, YouTube captions/metadata, foreign case law (US·Germany), and Coupang product reviews. / 대한민국 공공데이터 통합 MCP 서버. 법제처 법령·판례, DART 전자공시, 관세청 UNI-PASS, 금융감독원 금융상품, 금융위원회 보험공시, 조달청 나라장터, 수출입은행 환율, 농림축산식품부, 한국관광공사, YouTube 자막·메타데이터, 해외 판례(미국·독일), 쿠팡 파트너스 상품리뷰를 단일 서버에서 제공합니다.
homepage: https://github.com/hjsh200219/korea-public-data-mcp

build:
  dockerfile: Dockerfile
  dockerBuildPath: .

startCommand:
  type: http
  configSchema:
    type: object
    required:
      - lawApiOc
    properties:
      lawApiOc:
        type: string
        description: "law.go.kr API 인증키 (필수) — 법제처 국가법령정보센터"
      dartApiKey:
        type: string
        description: "DART 전자공시 API key (선택) — 없으면 기업공시 도구 비활성화"
      data20ServiceKey:
        type: string
        description: "공공데이터포털 service key (선택) — 없으면 공공데이터 도구 비활성화"
      unipassKeyApi:
        type: string
        description: "관세청 UNI-PASS API 인증키 (선택) — 없으면 통관/관세 도구 비활성화"
      mafraApiKey:
        type: string
        description: "농림축산식품부 API key (선택)"
      exchangeRateApiKey:
        type: string
        description: "수출입은행 환율 API key (선택)"
      finlifeApiKey:
        type: string
        description: "금융감독원 금융상품 비교공시 API key (선택)"
      youtubeApiKey:
        type: string
        description: "YouTube Data API v3 key (선택) — 없으면 자막만 사용 가능"
      courtlistenerApiToken:
        type: string
        description: "CourtListener API 토큰 (선택) — 미국 판례 검색"
      coupangAccessKey:
        type: string
        description: "쿠팡 파트너스 Access Key (선택) — 없으면 쿠팡 상품 검색 비활성화"
      coupangSecretKey:
        type: string
        description: "쿠팡 파트너스 Secret Key (선택)"
      foreignCaseEnabled:
        type: string
        description: "'true' 설정 시 토큰 없이도 독일 판례(OpenLegalData) 활성화"
        default: "true"
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['--use-system-ca', 'dist/remote.js'],
      env: {
        LAW_API_OC: config.lawApiOc,
        DART_API_KEY: config.dartApiKey || '',
        DATA20_SERVICE_KEY: config.data20ServiceKey || '',
        UNIPASS_KEY_API: config.unipassKeyApi || '',
        MAFRA_API_KEY: config.mafraApiKey || '',
        EXCHANGE_RATE_API_KEY: config.exchangeRateApiKey || '',
        FINLIFE_API_KEY: config.finlifeApiKey || '',
        YOUTUBE_API_KEY: config.youtubeApiKey || '',
        COURTLISTENER_API_TOKEN: config.courtlistenerApiToken || '',
        COUPANG_ACCESS_KEY: config.coupangAccessKey || '',
        COUPANG_SECRET_KEY: config.coupangSecretKey || '',
        FOREIGN_CASE_ENABLED: config.foreignCaseEnabled || 'true'
      }
    })
  exampleConfig:
    lawApiOc: your-law-api-oc-code
    dartApiKey: your-dart-api-key
    foreignCaseEnabled: "true"
